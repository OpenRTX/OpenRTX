name: "Nix build"
on:
  workflow_dispatch:
  pull_request:

# Cancel superseded runs of the same PR, keep manual runs. As in main.yml,
# pushes do not start a run on their own and the event name is part of the
# group key so a manual run is never cancelled as a superseded PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # OIDC token for pushing build outputs to the niks3 binary cache
  id-token: write

env:
  NIKS3_SERVER: https://niks3.fu.io

jobs:
  # The arm-miosix-eabi toolchain is the long pole (~15 min on 16 cores). It
  # is built once and pushed to the cache so the firmware jobs substitute it.
  toolchain:
    name: Miosix toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ env.NIKS3_SERVER }}
      - name: Build
        run: nix build -L .#miosix-toolchain

  # One job per attribute of the flake's githubActions output, generated by
  # nix-github-actions: every check, firmware image, flashing app, emulator
  # variant and dev shell on x86_64-linux. Evaluating every output for every
  # supported system happens here too, before the matrix is handed out.
  matrix:
    name: Evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@main
      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build
      - name: Generate the matrix
        id: matrix
        run: echo "matrix=$(nix eval --json .#githubActions.matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [matrix, toolchain]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ env.NIKS3_SERVER }}
      - name: Build
        run: nix build -L '.#${{ matrix.attr }}'
      # One artifact per radio, named openrtx-<radio> as in main.yml, holding
      # that radio's whole package: the ELF, the raw image and the release
      # images. Copied out because result/ is a link into the read-only store.
      - name: Collect firmware
        if: startsWith(matrix.name, 'openrtx-')
        run: |
          mkdir firmware
          cp -L result/* firmware/
          ls -la firmware/
      - name: Upload firmware
        if: startsWith(matrix.name, 'openrtx-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: firmware/
          if-no-files-found: error
