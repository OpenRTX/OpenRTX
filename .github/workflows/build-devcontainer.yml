name: "Build and publish devcontainer images"
on:
  # This image is the layer cache for the "Build and test" workflow. The base
  # image is pinned by digest in the Containerfile, so the cache only needs
  # refreshing when the devcontainer inputs change.
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "requirements.txt"
      - ".github/workflows/build-devcontainer.yml"
      - ".devcontainer/**"
  pull_request:
    paths:
      - "requirements.txt"
      - ".github/workflows/build-devcontainer.yml"
      - ".devcontainer/**"

jobs:
  sdk-build:
    name: Build multi-arch devcontainer images
    strategy:
      matrix:
        target:
          - miosix
          - zephyr
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/openrtx-sdk-${{ matrix.target }}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        if: github.repository == 'OpenRTX/OpenRTX' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build devcontainer images
        uses: devcontainers/ci@v0.3
        with:
          configFile: ./.devcontainer/${{ matrix.target }}/devcontainer.json
          imageName: ${{ env.IMAGE }}
          cacheFrom: ${{ env.IMAGE }}
          platform: ${{ matrix.platform }}
          push: ${{ github.repository == 'OpenRTX/OpenRTX' && github.event_name != 'pull_request' && 'always' || 'never' }}
          useNativeRunner: true

  sdk-publish:
    name: Merge and publish multi-arch devcontainer images
    if: github.repository == 'OpenRTX/OpenRTX' && github.event_name != 'pull_request'
    needs: sdk-build
    strategy:
      matrix:
        target:
          - miosix
          - zephyr
    runs-on: ubuntu-26.04
    steps:
      - name: Set image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/openrtx-sdk-${{ matrix.target }}" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Merge arch images into multi-arch manifest
        uses: devcontainers/ci/merge@v0.3
        with:
          imageName: ${{ env.IMAGE }}
          platforms: linux/amd64,linux/arm64

