name: "Build devcontainer images"
on:
  # This image is the layer cache for the "Build and test" workflow. The base
  # image is pinned by digest in the Containerfile, so the cache only needs
  # refreshing when the devcontainer inputs change.
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "requirements.txt"
      - ".github/workflows/build-devcontainer.yml"
      - ".devcontainer/**"
  pull_request:
    paths:
      - "requirements.txt"
      - ".github/workflows/build-devcontainer.yml"
      - ".devcontainer/**"

env:
  # Image names follow the running repository so that forks push to their
  # own ghcr.io namespace and can test their generated images.
  SDK_IMAGE_MIOSIX: ghcr.io/${{ github.repository_owner }}/openrtx-sdk-miosix
  SDK_IMAGE_ZEPHYR: ghcr.io/${{ github.repository_owner }}/openrtx-sdk-zephyr

jobs:
  devcontainer:
    name: Build and upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pre-build Miosix devcontainer image
        uses: devcontainers/ci@v0.3
        with:
          configFile: ./.devcontainer/miosix/devcontainer.json
          imageName: ${{ env.SDK_IMAGE_MIOSIX }}
          cacheFrom: ${{ env.SDK_IMAGE_MIOSIX }}
          push: ${{ github.event_name != 'pull_request' && 'always' || 'never' }}
      - name: Pre-build Zephyr devcontainer image
        uses: devcontainers/ci@v0.3
        with:
          configFile: ./.devcontainer/zephyr/devcontainer.json
          imageName: ${{ env.SDK_IMAGE_ZEPHYR }}
          cacheFrom: ${{ env.SDK_IMAGE_ZEPHYR }}
          push: ${{ github.event_name != 'pull_request' && 'always' || 'never' }}
