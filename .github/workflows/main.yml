name: "Build and test"
on:
  workflow_dispatch:
  push:
  pull_request:

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  DEVCONTAINER_NAME: ghcr.io/openrtx/openrtx-devcontainer

# Cancel superseded runs of the same PR, keep all runs on branches. The event
# name is part of the group key because a push to a same-repo pull request
# branch starts both a push run and a pull_request run: in a shared group,
# whichever queued first would be cancelled as superseded, and losing the
# pull_request run means the PR build comment is never updated for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: install-deps
        run: |
          sudo apt update
          sudo apt install -y git pkg-config build-essential meson libsdl2-dev libreadline-dev dfu-util cmake libusb-1.0-0 libusb-1.0-0-dev libcodec2-dev codec2 catch2
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      # gcovr is a standalone CLI rather than an import dependency, so install
      # it as a uv tool. `--color never` keeps ANSI codes out of the path.
      - name: Install Python tools
        run: |
          uv tool install "gcovr>=7.2"
          uv --color never tool dir --bin >> "$GITHUB_PATH"
      - name: setup meson
        run: |
          cd ${{github.workspace}}
          meson setup build -Db_coverage=true
      - name: Run unit tests
        run: meson test -C build --print-errorlogs --test-args '--reporter junit'
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/build/meson-logs/testlog.junit.xml'
      - name: Generate coverage report
        if: always()
        run: bash scripts/coverage.sh --ci build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/cobertura.xml
      - name: Add coverage to Github step summary
        run: |
          cat build/coverage/coverage.md >> $GITHUB_STEP_SUMMARY
  build-zephyr:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: app
      - name: install-deps
        run: |
          sudo apt update
          sudo apt install -y git pkg-config build-essential meson libsdl2-dev libreadline-dev dfu-util cmake libusb-1.0-0 libusb-1.0-0-dev libcodec2-dev codec2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: xtensa-espressif_esp32s3_zephyr-elf
          sdk-version: 0.17.0
      - name: Compile zephyr
        run: |
          cd app
          meson setup build
          meson compile -C build openrtx_ttwrplus_uf2
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: zephyr-release-bins
          path: |
            app/build/openrtx_*.uf2
      - name: Upload T-TWR Plus firmware
        uses: actions/upload-artifact@v4
        with:
          name: openrtx-ttwrplus
          path: |
            app/build/openrtx_*.uf2
          if-no-files-found: error
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Replace slashes in branch name
        run: echo "BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '/' '-')" >> "$GITHUB_ENV"
      - name: Compile using devcontainer
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ${{ env.DEVCONTAINER_NAME }}
          push: never
          runCmd: |
            meson setup build_linux &&
            meson setup --cross-file cross_cm4.txt build_cm4 &&
            meson setup --cross-file cross_cm7.txt build_cm7 &&
            meson compile -C build_linux openrtx_linux &&
            meson compile -C build_linux openrtx_linux_smallscreen &&
            meson compile -C build_linux openrtx_linux_mod17 &&
            meson compile -C build_cm4 openrtx_cs7000_bin &&
            meson compile -C build_cm4 openrtx_cs7000_dfu &&
            meson compile -C build_cm4 openrtx_dm1701_wrap &&
            meson compile -C build_cm4 openrtx_dm1801_wrap &&
            meson compile -C build_cm4 openrtx_md3x0_wrap &&
            meson compile -C build_cm4 openrtx_md9600_wrap &&
            meson compile -C build_cm4 openrtx_mduv3x0_wrap &&
            meson compile -C build_cm4 openrtx_mod17_bin &&
            meson compile -C build_cm4 openrtx_gd77_wrap &&
            meson compile -C build_cm7 openrtx_cs7000p_wrap &&
            meson compile -C build_cm7 openrtx_cs7000p_dfu &&
            meson compile -C build_cm4 openrtx_rt4d_bin &&
            chmod -R a+rX build_linux build_cm4 build_cm7
      # The build runs as root in the container, so the binaries land in the
      # bind-mounted workspace owned by root. Copying rather than moving (as
      # this did before) needs only read access, which the default umask
      # already grants; the chmod above keeps that true under a stricter one.
      # Moving is what required the old chmod -R 777: renaming out of a
      # root-owned directory needs write permission on the directory itself.
      - name: Collect firmware
        run: |
          while read -r src dst; do
            [ -n "$src" ] || continue
            cp "$src" "$dst"
          done <<EOF
          build_cm7/openrtx_cs7000p_wrap    openrtx_cs7000p_${BRANCH_NAME}.bin
          build_cm7/openrtx_cs7000p_dfu     openrtx_cs7000p_${BRANCH_NAME}.dfu
          build_cm4/openrtx_cs7000_bin      openrtx_cs7000_${BRANCH_NAME}.bin
          build_cm4/openrtx_cs7000_dfu      openrtx_cs7000_${BRANCH_NAME}.dfu
          build_cm4/openrtx_dm1701_wrap     openrtx_dm1701_${BRANCH_NAME}.bin
          build_cm4/openrtx_dm1801_bin.sgl  openrtx_dm1801_${BRANCH_NAME}.sgl
          build_cm4/openrtx_gd77_bin.sgl    openrtx_gd77_${BRANCH_NAME}.sgl
          build_linux/openrtx_linux         openrtx_linux_${BRANCH_NAME}
          build_cm4/openrtx_md3x0_wrap      openrtx_md3x0_${BRANCH_NAME}.bin
          build_cm4/openrtx_md9600_wrap     openrtx_md9600_${BRANCH_NAME}.bin
          build_cm4/openrtx_mduv3x0_wrap    openrtx_mduv3x0_${BRANCH_NAME}.bin
          build_cm4/openrtx_mod17_bin       openrtx_mod17_${BRANCH_NAME}.bin
          build_cm4/openrtx_rt4d_bin        openrtx_rt4d_${BRANCH_NAME}.bin
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: release-bins
          path: |
            ${{github.workspace}}/openrtx_cs7000p_${{ env.BRANCH_NAME }}.bin
            ${{github.workspace}}/openrtx_cs7000p_${{ env.BRANCH_NAME }}.dfu
            ${{github.workspace}}/openrtx_cs7000_${{ env.BRANCH_NAME }}.bin
            ${{github.workspace}}/openrtx_cs7000_${{ env.BRANCH_NAME }}.dfu
            ${{github.workspace}}/openrtx_dm1701_${{ env.BRANCH_NAME }}.bin
            ${{github.workspace}}/openrtx_dm1801_${{ env.BRANCH_NAME }}.sgl
            ${{github.workspace}}/openrtx_gd77_${{ env.BRANCH_NAME }}.sgl
            ${{github.workspace}}/openrtx_linux_${{ env.BRANCH_NAME }}
            ${{github.workspace}}/openrtx_md3x0_${{ env.BRANCH_NAME }}.bin
            ${{github.workspace}}/openrtx_md9600_${{ env.BRANCH_NAME }}.bin
            ${{github.workspace}}/openrtx_mduv3x0_${{ env.BRANCH_NAME }}.bin
            ${{github.workspace}}/openrtx_mod17_${{ env.BRANCH_NAME }}.bin
            ${{github.workspace}}/openrtx_rt4d_${{ env.BRANCH_NAME }}.bin
          if-no-files-found: error
  # One artifact per radio, so the pull request comment can offer a direct
  # download per device. The release-bins artifact from `build` is kept as-is
  # for anyone with an existing link to the whole set.
  #
  # This repackages what `build` produced rather than building each radio on
  # its own: a matrix only varies jobs, and nearly all of a build job is
  # devcontainer setup (~3 min warm, ~30 min when the image cache is cold)
  # against about a minute of actual compiling for every target together.
  upload-firmware:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        radio:
          - cs7000
          - cs7000p
          - dm1701
          - dm1801
          - gd77
          - md3x0
          - md9600
          - mduv3x0
          - mod17
          - rt4d
    steps:
      - name: Download the built firmware
        uses: actions/download-artifact@v4
        with:
          name: release-bins
          path: firmware
      # Every radio has a distinct openrtx_<radio>_ prefix, so this picks out
      # exactly that radio's files (both the .bin and the .dfu for the CS7000s)
      # without needing the branch name. openrtx_cs7000_ does not match the
      # CS7000 Plus, whose files are openrtx_cs7000p_.
      - name: Upload the firmware for this radio
        uses: actions/upload-artifact@v4
        with:
          name: openrtx-${{ matrix.radio }}
          path: firmware/openrtx_${{ matrix.radio }}_*
          if-no-files-found: error
