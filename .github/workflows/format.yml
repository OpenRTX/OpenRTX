name: "Format sources"
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: install-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check if there are format errors
        run: ./scripts/clang_format.sh --check
      - name: REUSE Compliance Check (confirm copyright and licenses)
        uses: fsfe/reuse-action@v6

  check-strings:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Check UI string tables are in sync with stringsTable_t and English
        run: python3 ./scripts/check_strings.py

  check-voice-prompts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Test the voice prompt generator
        run: python3 ./scripts/test_generate_voice_prompts.py
      - name: Check voiceprompts.vpc is up to date with the prompt texts
        run: python3 ./scripts/generate_voice_prompts.py --check
