name: "Format sources"
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: install-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check if there are format errors
        run: ./scripts/clang_format.sh --check
      - name: REUSE Compliance Check (confirm copyright and licenses)
        uses: fsfe/reuse-action@v6

  check-strings:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Check UI string tables are in sync with stringsTable_t and English
        run: python3 ./scripts/check_strings.py

  ruff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Ruff check Horse Python
        run: |
          uv venv .venv
          # shellcheck disable=SC1091
          source .venv/bin/activate
          uv pip install ruff
          ruff check scripts/horse_provision.py scripts/horse_openpgp.py tests/python
