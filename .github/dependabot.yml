version: 2
updates:
  # The devcontainer base image is pinned by digest so the CI layer cache
  # stays valid; let Dependabot propose the bumps.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    # Digest bumps only; change Ubuntu releases by hand.
    ignore:
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Bumps the flake inputs in flake.lock; the Nix build workflow runs the
  # checks and every image on the PR (see "Updating pins" in nix/README.md).
  - package-ecosystem: nix
    directory: /
    commit-message:
      prefix: build
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
