#
# ListenAI CSK6011B SoC-level configuration, shared by all boards
# based on this chip (e.g. the Retevis C62).
# Board-specific options belong in the board <board>_defconfig file.
#

CONFIG_SOC_CSK6=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=300000000

# SoC drivers
CONFIG_UART_CSK6=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_SPI_CSK6=y
CONFIG_I2C_CSK6=y
CONFIG_ADC_CSK6=y
CONFIG_PWM_CSK6=y
CONFIG_ENTROPY_CSK6_RNG=y
CONFIG_FLASH_CSK6_LOCK=y

# Required by the LSF audio service, see
# platform/targets/c62/services/CMakeLists.txt
CONFIG_CSK6_FLASH_STALL_SECOND_CORE=n

# Subsystems required by the drivers above
CONFIG_SERIAL=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CLOCK_CONTROL=y

# Kernel / CPU
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=81920
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_FPU=y
CONFIG_ASSERT=y

CONFIG_CSK_HEAP=y
CONFIG_CSK_HEAP_MEM_POOL_SIZE=307200

CONFIG_CSK6_PSRAM=y

# FROM ESP32S3
CONFIG_POSIX_CLOCK=y
CONFIG_PTHREAD_IPC=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP14=y
CONFIG_PRINTK=y
CONFIG_PRINTK_SYNC=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_NEWLIB_LIBC=y

# Enable UART logging backend
CONFIG_LOG_BACKEND_UART=y

# Disable shells by default (size + production defaults)
CONFIG_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_GPIO_SHELL=n
CONFIG_FLASH_SHELL=n
CONFIG_DAC_SHELL=n
CONFIG_I2C_SHELL=n
CONFIG_PWM_SHELL=n
CONFIG_ADC_SHELL=n
