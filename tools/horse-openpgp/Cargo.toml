[package]
name = "horse-openpgp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Horse OpenPGP subkey extract/inspect helper (sequoia-openpgp)"
publish = false

[dependencies]
sequoia-openpgp = { version = "=2.4.2", default-features = false, features = ["crypto-rust", "compression", "allow-experimental-crypto", "allow-variable-time-crypto"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
clap = { version = "=4.5.37", features = ["derive"] }
anyhow = "=1.0.98"
hex = "=0.4.3"
zeroize = { version = "=1.8.1", features = ["derive"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
ed25519-dalek = "=2.1.1"
chrono = { version = "=0.4.40", default-features = false, features = ["clock", "std"] }
blake2 = "=0.10.6"
digest = "=0.10.7"

[profile.release]
lto = true
codegen-units = 1
